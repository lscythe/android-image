name: image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Weekly rebuild to pick up Ubuntu and JDK security updates.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      android_packages:
        description: Space separated sdkmanager package ids (empty keeps the Dockerfile default)
        required: false
      sonar_scanner_version:
        description: SonarScanner CLI version (needs sonar_scanner_sha256 too)
        required: false
      sonar_scanner_sha256:
        description: SHA-256 of sonar-scanner-cli-<version>.zip
        required: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect build args
        id: args
        env:
          ANDROID_PACKAGES: ${{ inputs.android_packages }}
          SONAR_SCANNER_VERSION: ${{ inputs.sonar_scanner_version }}
          SONAR_SCANNER_SHA256: ${{ inputs.sonar_scanner_sha256 }}
        run: |
          {
            echo 'build_args<<EOF'
            [ -n "$ANDROID_PACKAGES" ] && echo "ANDROID_PACKAGES=$ANDROID_PACKAGES"
            [ -n "$SONAR_SCANNER_VERSION" ] && echo "SONAR_SCANNER_VERSION=$SONAR_SCANNER_VERSION"
            [ -n "$SONAR_SCANNER_SHA256" ] && echo "SONAR_SCANNER_SHA256=$SONAR_SCANNER_SHA256"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: ${{ steps.args.outputs.build_args }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: android-ci:test
          pull: true
          # A cached apt layer would hide new security updates, so scheduled runs start clean.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: test/smoke-test.sh android-ci:test

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: ${{ steps.args.outputs.build_args }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha
